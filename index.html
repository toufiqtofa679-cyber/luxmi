<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxo - BD — Premium Products • Better You</title>
<meta name="description" content="Genuine Australian-sourced skincare, cosmetics and supplements. Cash on delivery across Bangladesh, free delivery in Chittagong, dispatched within 24 hours.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf9f5;--white:#fff;--deep:#082b25;--deep2:#061d19;--gold:#c99c4a;--gold2:#e4c17d;--text:#12241f;--muted:#66736e;--line:#e9e5db;--shadow:0 10px 32px rgba(8,43,37,.07);--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--text);font-family:"DM Sans",Arial,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit}.wrap{width:min(1500px,calc(100% - 44px));margin:auto}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;line-height:1.08}.eyebrow{font-size:10px;letter-spacing:.27em;color:#9b7a43;text-transform:uppercase}
.header{background:rgba(255,255,255,.94);backdrop-filter:blur(14px);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line)}
.header-inner{height:82px;display:flex;align-items:center;gap:34px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:260px}
.brand-img{width:62px;height:62px;object-fit:contain}.brand-copy strong{font:600 25px "Playfair Display",Georgia,serif;letter-spacing:.07em;display:block}
.brand-copy small{font-size:8px;letter-spacing:.22em;color:#80612c;font-weight:700;display:block;margin-top:3px;opacity:1;text-shadow:0 0 .2px currentColor}.nav{display:flex;gap:38px;margin-left:auto;align-items:center}
.nav a{text-decoration:none;color:#263b35;font-size:13px;position:relative;padding:30px 0}.nav a.active:after,.nav a:hover:after{content:"";position:absolute;left:0;right:0;bottom:18px;height:2px;background:var(--gold)}
.header-actions{display:flex;align-items:center;gap:18px;margin-left:8px}.icon-btn{border:0;background:none;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--text);font-size:19px}
.order-btn{border:0;background:linear-gradient(135deg,#d5aa5c,#b98737);color:white;border-radius:999px;padding:13px 21px;cursor:pointer;font-weight:600;box-shadow:0 7px 18px rgba(185,135,55,.22)}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--deep);color:white;font-size:10px;margin-left:5px;vertical-align:top}
</style>
</head>
<body>
<div class="header">
  <div class="wrap header-inner">
    <a href="#" class="brand">
      <img src="/luxo-bd-full-black.png" alt="Luxo BD" class="brand-img">
      <div class="brand-copy"><strong>LUXO BD</strong><small>PREMIUM AUSTRALIAN IMPORTS</small></div>
    </a>
    <nav class="nav">
      <a href="#products" class="active">Store</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="order-btn" onclick="location.href='#products'">Order Now</button>
    </div>
  </div>
</div>
<div class="wrap" style="padding: 40px 0; text-align: center;">
  <h1>Welcome to Luxo BD</h1>
  <p>Your premium platform for authentic products is ready.</p>
</div>
</body>
</html>
