<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUXO BD — Admin Portal</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#12241f;--muted:#6b7772;--deep:#082b25;--deep2:#061d19;--gold:#c99c4a;--line:#e2e6e1;--ok:#28764a;--danger:#a33b32;--shadow:0 18px 50px rgba(8,43,37,.08)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#e7efe9 0,transparent 35%),var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}
.shell{max-width:1280px;margin:auto;padding:24px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{font:600 28px Georgia,serif;letter-spacing:.08em}.sub{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:750}.primary{background:linear-gradient(135deg,#d6ad61,#b78435);color:#fff;box-shadow:0 8px 20px rgba(185,132,53,.18)}.dark{background:var(--deep);color:#fff}.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff1ef;color:var(--danger);border:1px solid #efcbc6}.btn:active{transform:translateY(1px)}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.login{max-width:450px;margin:10vh auto;padding:28px}.login h1{font:500 32px Georgia,serif;margin:0 0 7px}.field{margin-top:14px}.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #d9dfda;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9ab3a9;box-shadow:0 0 0 3px rgba(61,111,91,.08)}.field textarea{min-height:94px;resize:vertical}.help{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.45}.notice{padding:11px 13px;border-radius:11px;font-size:12px;margin:12px 0}.ok{background:#edf8f0;color:#216238}.err{background:#fff0ee;color:#9d2f27}.warn{background:#fff8e8;color:#8a6421}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 8px 28px rgba(8,43,37,.05)}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.stat b{display:block;font-size:25px;margin-top:4px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;flex-wrap:wrap}.search{min-width:260px;flex:1;max-width:520px}.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.select{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:920px}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:12px 10px;font-size:11px;vertical-align:middle}.table th{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em}.prod{display:flex;gap:10px;align-items:center;min-width:260px}.thumb{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#f1f3ef;border:1px solid var(--line)}.prod b{display:block;font-size:12px}.prod small{display:block;color:var(--muted);margin-top:3px}.status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:9px;font-weight:800}.live{background:#e9f8ee;color:#237342}.off{background:#f0f1ef;color:#6b7772}.draft{background:#fff4dc;color:#8a6421}.empty{text-align:center;color:var(--muted);padding:40px!important}
.modal{position:fixed;inset:0;background:rgba(3,18,14,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.modal-box{background:#fff;border-radius:20px;width:min(820px,100%);max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.22);padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}.modal-head h2{font:500 26px Georgia,serif;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.preview{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.preview img{width:90px;height:90px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#f3f4f1}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.quick button{border:1px dashed #cbd5cf;background:#f8faf8;border-radius:9px;padding:7px 9px;font-size:10px;cursor:pointer}.login-logo{font-size:10px;letter-spacing:.16em;color:var(--gold);font-weight:800;margin-bottom:10px}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');let products=[];let editingId=null;let currentQuery='';let currentStatus='all';let currentUser=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>'৳'+Number(n||0).toLocaleString('en-US');
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||('Request failed: '+r.status));return d}
function login(message=''){app.innerHTML=`<div class="card login"><div class="login-logo">LUXO BD · PRIVATE AREA</div><h1>Admin Portal</h1><div class="sub">Separate secure accounts for Owner and Admin</div>${message?'<div class="notice err">'+esc(message)+'</div>':''}<div class="field"><label>USERNAME</label><input id="un" autocomplete="username" placeholder="owner or admin username"></div><div class="field"><label>PASSWORD</label><input id="pw" type="password" autocomplete="current-password" placeholder="Enter your password"></div><div class="help">Each account has its own password and session.</div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="doLogin()">Sign in securely</button><a class="btn light" href="/">Back to Store</a></div></div>`;document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})}
async function doLogin(){try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:document.getElementById('un').value.trim(),password:document.getElementById('pw').value})});currentUser=d.user;await dashboard()}catch(e){login(e.message)}}
async function check(){try{const d=await api('/api/admin/session');currentUser=d.user;await dashboard()}catch{login()}}
function filtered(){return products.filter(p=>(currentStatus==='all'||(currentStatus==='live'?p.active:p.active===false))&&((p.name||'').toLowerCase().includes(currentQuery)||(p.cat||'').toLowerCase().includes(currentQuery)||(p.size||'').toLowerCase().includes(currentQuery)))}
function dashboard(){app.innerHTML=`<div class="shell"><div class="top"><div><div class="brand">LUXO BD</div><div class="sub">Premium Storefront · Product Control Center</div></div><div class="actions"><button class="btn primary" onclick="openForm()">＋ Add Product</button><button class="btn light" onclick="logout()">Log out</button></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="modal"></div></div>`;renderTable()}
function renderTable(){const rows=document.getElementById('rows');if(!rows)return;const list=filtered();rows.innerHTML=list.length?list.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.cat)}</td><td><b>${money(p.price)}</b></td><td><span class="status ${p.active!==false?'live':'off'}">${p.active!==false?'LIVE':'HIDDEN'}</span></td><td><button class="btn light" onclick="openForm(${JSON.stringify(p).replace(/</g,"\\u003c")})">Edit</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No products found.</td></tr>'}
function openForm(p=null){
  editingId=p?.id||null;
  const modalContainer=document.getElementById('modal');
  if(!modalContainer)return;
  modalContainer.innerHTML=`<div class="modal open"><div class="modal-box"><div class="modal-head"><h2>${p?'Edit Product':'Add Product'}</h2><button class="btn light" type="button" onclick="closeForm()">×</button></div><form onsubmit="saveProduct(event)"><div class="field"><label>PRODUCT NAME *</label><input id="f_name" required value="${esc(p?.name||'')}"></div><div class="field"><label>CATEGORY *</label><input id="f_cat" required value="${esc(p?.cat||'Skincare')}"></div><div class="field"><label>PRICE (BDT) *</label><input id="f_price" type="number" required value="${p?.price??''}"></div><div class="actions" style="margin-top:18px"><button class="btn primary" type="submit">Save Product</button><button class="btn light" type="button" onclick="closeForm()">Cancel</button></div></form></div></div>`;
}
function closeForm(){document.getElementById('modal').innerHTML='';}
async function saveProduct(e){e.preventDefault();const body={name:document.getElementById('f_name').value.trim(),cat:document.getElementById('f_cat').value.trim(),price:Number(document.getElementById('f_price').value),active:true};try{await api(editingId?'/api/admin/products/'+editingId:'/api/admin/products',{method:editingId?'PUT':'POST',body:JSON.stringify(body)});closeForm();await load()}catch(err){alert(err.message)}}
async function load(){products=await api('/api/admin/products');renderTable()}
async function logout(){try{await api('/api/admin/logout',{method:'POST'})}finally{login()}}
check();
</script>
</body>
</html>
