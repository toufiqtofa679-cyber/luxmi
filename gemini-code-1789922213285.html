<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUXO BD — Admin Portal</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#12241f;--muted:#6b7772;--deep:#082b25;--deep2:#061d19;--gold:#c99c4a;--line:#e2e6e1;--ok:#28764a;--danger:#a33b32;--shadow:0 18px 50px rgba(8,43,37,.08)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#e7efe9 0,transparent 35%),var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}
.shell{max-width:1280px;margin:auto;padding:24px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{font:600 28px Georgia,serif;letter-spacing:.08em}.sub{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:750}.primary{background:linear-gradient(135deg,#d6ad61,#b78435);color:#fff;box-shadow:0 8px 20px rgba(185,132,53,.18)}.dark{background:var(--deep);color:#fff}.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff1ef;color:var(--danger);border:1px solid #efcbc6}.btn:active{transform:translateY(1px)}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.login{max-width:450px;margin:10vh auto;padding:28px}.login h1{font:500 32px Georgia,serif;margin:0 0 7px}.field{margin-top:14px}.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #d9dfda;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9ab3a9;box-shadow:0 0 0 3px rgba(61,111,91,.08)}.field textarea{min-height:94px;resize:vertical}.help{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.45}.notice{padding:11px 13px;border-radius:11px;font-size:12px;margin:12px 0}.ok{background:#edf8f0;color:#216238}.err{background:#fff0ee;color:#9d2f27}.warn{background:#fff8e8;color:#8a6421}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 8px 28px rgba(8,43,37,.05)}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.stat b{display:block;font-size:25px;margin-top:4px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;flex-wrap:wrap}.search{min-width:260px;flex:1;max-width:520px}.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.select{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:920px}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:12px 10px;font-size:11px;vertical-align:middle}.table th{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em}.prod{display:flex;gap:10px;align-items:center;min-width:260px}.thumb{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#f1f3ef;border:1px solid var(--line)}.prod b{display:block;font-size:12px}.prod small{display:block;color:var(--muted);margin-top:3px}.status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:9px;font-weight:800}.live{background:#e9f8ee;color:#237342}.off{background:#f0f1ef;color:#6b7772}.draft{background:#fff4dc;color:#8a6421}.empty{text-align:center;color:var(--muted);padding:40px!important}
.modal{position:fixed;inset:0;background:rgba(3,18,14,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.modal-box{background:#fff;border-radius:20px;width:min(820px,100%);max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.22);padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}.modal-head h2{font:500 26px Georgia,serif;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.preview{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}.preview img{width:90px;height:90px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#f3f4f1}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.quick button{border:1px dashed #cbd5cf;background:#f8faf8;border-radius:9px;padding:7px 9px;font-size:10px;cursor:pointer}.login-logo{font-size:10px;letter-spacing:.16em;color:var(--gold);font-weight:800;margin-bottom:10px}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.shell{padding:18px 12px 45px}.top{align-items:flex-start}.top .actions{width:100%}.top .actions .btn{flex:1}.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.search{min-width:100%;}.modal-box{padding:16px}.brand{font-size:24px}}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');let products=[];let editingId=null;let currentQuery='';let currentStatus='all';let currentUser=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>'৳'+Number(n||0).toLocaleString('en-US');
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||('Request failed: '+r.status));return d}
function login(message=''){app.innerHTML=`<div class="card login"><div class="login-logo">LUXO BD · PRIVATE AREA</div><h1>Admin Portal</h1><div class="sub">Separate secure accounts for Owner and Admin</div>${message?'<div class="notice err">'+esc(message)+'</div>':''}<div class="field"><label>USERNAME</label><input id="un" autocomplete="username" placeholder="owner or admin username"></div><div class="field"><label>PASSWORD</label><input id="pw" type="password" autocomplete="current-password" placeholder="Enter your password"></div><div class="help">Each account has its own password and session. Never share your password in chat or in website files.</div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="doLogin()">Sign in securely</button><a class="btn light" href="/">Back to Store</a></div></div>`;document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})}
async function doLogin(){try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:document.getElementById('un').value.trim(),password:document.getElementById('pw').value})});currentUser=d.user;await dashboard()}catch(e){login(e.message)}}
async function check(){try{const d=await api('/api/admin/session');currentUser=d.user;await dashboard()}catch{login()}}
function filtered(){return products.filter(p=>(currentStatus==='all'||(currentStatus==='live'?p.active:p.active===false))&&((p.name||'').toLowerCase().includes(currentQuery)||(p.cat||'').toLowerCase().includes(currentQuery)||(p.size||'').toLowerCase().includes(currentQuery)))}
function dashboard(){app.innerHTML=`<div class="shell"><div class="top"><div><div class="brand">LUXO BD</div><div class="sub">Premium Storefront · Product Control Center</div><div class="sub" style="margin-top:7px">Signed in as <b>${esc(currentUser?.display_name||currentUser?.username||'Admin')}</b> · ${esc(currentUser?.role||'admin')}</div></div><div class="actions"><button class="btn primary" onclick="openForm()">＋ Add Product</button>${currentUser?.role==='owner'?'<button class="btn dark" onclick="openUsers()">👥 Admin Accounts</button>':''}<button class="btn light" onclick="logout()">Log out</button></div></div><div class="stats"><div class="stat"><span>Total Products</span><b id="sTotal">0</b></div><div class="stat"><span>Live</span><b id="sLive">0</b></div><div class="stat"><span>Draft / Hidden</span><b id="sHidden">0</b></div><div class="stat"><span>Categories</span><b id="sCats">0</b></div></div><div class="toolbar"><div class="search"><input id="q" placeholder="Search product, category or size…" oninput="currentQuery=this.value.trim().toLowerCase();renderTable()"></div><select class="select" id="status" onchange="currentStatus=this.value;renderTable()"><option value="all">All products</option><option value="live">Live only</option><option value="hidden">Draft / Hidden</option></select><div class="actions"><button class="btn light" onclick="exportJSON()">Export JSON</button><label class="btn light" style="cursor:pointer">Import JSON<input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importJSON(this.files[0])"></label></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Status</th><th>Sort</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="modal"></div></div>`;renderStats();renderTable()}
function renderStats(){document.getElementById('sTotal').textContent=products.length;document.getElementById('sLive').textContent=products.filter(p=>p.active!==false).length;document.getElementById('sHidden').textContent=products.filter(p=>p.active===false).length;document.getElementById('sCats').textContent=new Set(products.map(p=>p.cat).filter(Boolean)).size}
function renderTable(){const rows=document.getElementById('rows');if(!rows)return;const list=filtered();rows.innerHTML=list.length?list.map(p=>`<tr><td><div class="prod">${p.image?`<img class="thumb" src="${esc(p.image)}" alt="">`:'<div class="thumb"></div>'}<div><b>${esc(p.name)}</b><small>${esc(p.size||'')}</small></div></div></td><td>${esc(p.cat)}</td><td><b>${money(p.price)}</b>${p.was?`<br><del style="color:#999;font-size:9px">${money(p.was)}</del>`:''}</td><td><span class="status ${p.active!==false?'live':'off'}">${p.active!==false?'LIVE':'HIDDEN'}</span>${Number(p.price)===0?'<br><span class="status draft" style="margin-top:4px">SET PRICE</span>':''}</td><td>${Number(p.sort_order||0)}</td><td><div class="actions"><button class="btn light" onclick="editProductPrompt(${p.id})">Edit</button><button class="btn light" onclick="duplicateProduct(${p.id})">Duplicate</button><button class="btn danger" onclick="removeProduct(${p.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No products found.</td></tr>'}

function editProductPrompt(id){const p=products.find(x=>x.id===id);if(p)openForm(p);}

function openForm(p=null){
  editingId=p?.id||null;
  const modalContainer=document.getElementById('modal');
  if(!modalContainer)return;
  modalContainer.innerHTML=`<div class="modal open"><div class="modal-box"><div class="modal-head"><div><h2>${p?'Edit Product':'Add Product'}</h2><div class="sub">Changes appear on the storefront after saving.</div></div><button class="btn light" type="button" onclick="closeForm()">×</button></div><form onsubmit="saveProduct(event)"><div class="grid"><div class="field"><label>PRODUCT NAME *</label><input id="f_name" required value="${esc(p?.name||'')}"></div><div class="field"><label>CATEGORY *</label><input id="f_cat" required list="catList" value="${esc(p?.cat||'Skincare')}"><datalist id="catList"><option>Skincare</option><option>Cosmetics</option><option>Supplements</option><option>Lifestyle</option></datalist></div><div class="field"><label>PRICE (BDT) *</label><input id="f_price" type="number" min="0" step="0.01" required value="${p?.price??''}"></div><div class="field"><label>OLD PRICE / WAS</label><input id="f_was" type="number" min="0" step="0.01" value="${p?.was??''}"></div><div class="field"><label>SIZE / VARIANT</label><input id="f_size" value="${esc(p?.size||'')}" placeholder="e.g. 60 Tablets"></div><div class="field"><label>SORT ORDER</label><input id="f_sort" type="number" value="${p?.sort_order??0}"></div><div class="field full"><label>FRONT IMAGE URL *</label><input id="f_image" value="${esc(p?.image||'')}" placeholder="/products/product-front.jpg or https://..."><div class="quick"><button type="button" onclick="setImg('/products/healthy-care-beauty-collagen-front.jpg')">Use collagen front</button></div></div><div class="field full"><label>SECOND / BACK IMAGE URL</label><input id="f_image2" value="${esc(p?.image2||'')}" placeholder="/products/product-back.jpg or https://..."><div class="quick"><button type="button" onclick="setImg2('/products/healthy-care-beauty-collagen-back.jpg')">Use collagen back</button></div></div><div class="field full"><div class="preview" id="preview"></div></div><div class="field full"><label>ENGLISH DESCRIPTION</label><textarea id="f_desc">${esc(p?.description||'')}</textarea></div><div class="field full"><label>BANGLA DESCRIPTION</label><textarea id="f_bn">${esc(p?.bn||'')}</textarea></div><div class="field"><label>FEATURES — ONE PER LINE</label><textarea id="f_features">${esc((Array.isArray(p?.features)?p.features:[]).join('\n'))}</textarea></div><div class="field"><label>STORE STATUS</label><select id="f_active"><option value="1" ${p?.active!==false?'selected':''}>Live — show on website</option><option value="0" ${p?.active===false?'selected':''}>Hidden — keep as draft</option></select></div></div><div id="formMsg"></div><div class="actions" style="margin-top:18px"><button class="btn primary" type="submit">Save Product</button><button class="btn light" type="button" onclick="closeForm()">Cancel</button></div></form></div></div>`;
  updatePreview();
  const imgInput1=document.getElementById('f_image');
  const imgInput2=document.getElementById('f_image2');
  if(imgInput1)imgInput1.addEventListener('input',updatePreview);
  if(imgInput2)imgInput2.addEventListener('input',updatePreview);
}

function setImg(v){const el=document.getElementById('f_image');if(el){el.value=v;updatePreview();}}
function setImg2(v){const el=document.getElementById('f_image2');if(el){el.value=v;updatePreview();}}
function updatePreview(){const el=document.getElementById('preview');if(!el)return;const a=document.getElementById('f_image')?.value.trim(),b=document.getElementById('f_image2')?.value.trim();el.innerHTML=[a,b].filter(Boolean).map(x=>`<img src="${esc(x)}" onerror="this.style.opacity=.3" alt="preview">`).join('')}
function closeForm(){const m=document.getElementById('modal');if(m){m.innerHTML='';}}
async function saveProduct(e){e.preventDefault();const msg=document.getElementById('formMsg');if(msg)msg.innerHTML='';const body={name:document.getElementById('f_name').value.trim(),cat:document.getElementById('f_cat').value.trim(),price:Number(document.getElementById('f_price').value),was:document.getElementById('f_was').value?Number(document.getElementById('f_was').value):null,size:document.getElementById('f_size').value.trim(),sort_order:Number(document.getElementById('f_sort').value||0),image:document.getElementById('f_image').value.trim(),image2:document.getElementById('f_image2').value.trim(),description:document.getElementById('f_desc').value.trim(),bn:document.getElementById('f_bn').value.trim(),features:document.getElementById('f_features').value.split('\n').map(x=>x.trim()).filter(Boolean),active:document.getElementById('f_active').value==='1'};try{await api(editingId?'/api/admin/products/'+editingId:'/api/admin/products',{method:editingId?'PUT':'POST',body:JSON.stringify(body)});closeForm();await load()}catch(err){if(msg)msg.innerHTML='<div class="notice err">'+esc(err.message)+'</div>'}}
async function duplicateProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const copy={...p,name:p.name+' — Copy',active:false,sort_order:Number(p.sort_order||0)+1};delete copy.id;try{await api('/api/admin/products',{method:'POST',body:JSON.stringify(copy)});await load()}catch(e){alert(e.message)}}
async function removeProduct(id){const p=products.find(x=>x.id===id);if(!confirm('Delete “'+(p?.name||'this product')+'” permanently?'))return;try{await api('/api/admin/products/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}}

async function openUsers(){
 if(currentUser?.role!=='owner')return alert('Owner access required.');
 try{
 const users=await api('/api/admin/users');
 const modalContainer=document.getElementById('modal');
 if(!modalContainer)return;
 modalContainer.innerHTML=`<div class="modal open"><div class="modal-box"><div class="modal-head"><div><h2>Admin Accounts</h2><div class="sub">Owner can create, disable and reset passwords for separate accounts.</div></div><button class="btn light" type="button" onclick="closeForm()">×</button></div><div id="userList"></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><form onsubmit="createUser(event)"><div class="grid"><div class="field"><label>USERNAME *</label><input id="u_name" required placeholder="e.g. friend"></div><div class="field"><label>DISPLAY NAME *</label><input id="u_display" required placeholder="Friend Admin"></div><div class="field"><label>ROLE</label><select id="u_role"><option value="admin">Admin — products</option><option value="owner">Owner — full control</option></select></div><div class="field"><label>TEMPORARY PASSWORD *</label><input id="u_pass" type="password" minlength="10" required placeholder="Minimum 10 characters"></div></div><div class="actions" style="margin-top:14px"><button class="btn primary">Create Account</button></div></form></div></div>`;
 renderUsers(users);
 }catch(e){alert(e.message)}
}

function renderUsers(users){const el=document.getElementById('userList');if(!el)return;el.innerHTML=users.map(u=>`<div class="card" style="padding:12px;margin:8px 0"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><b>${esc(u.display_name)}</b><div class="sub">@${esc(u.username)} · ${esc(u.role)} · ${u.active?'Active':'Disabled'}</div></div><div class="actions"><button class="btn light" type="button" onclick='editUser(${JSON.stringify(u).replace(/</g,"\\u003c")})'>Edit / Reset Password</button></div></div></div>`).join('')}

async function createUser(e){e.preventDefault();try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({username:document.getElementById('u_name').value.trim(),display_name:document.getElementById('u_display').value.trim(),role:document.getElementById('u_role').value,password:document.getElementById('u_pass').value})});alert('Account created. Give the password to the user privately.');openUsers()}catch(err){alert(err.message)}}

function editUser(u){
 document.getElementById('modal').innerHTML=`<div class="modal open"><div class="modal-box"><div class="modal-head"><h2>Edit Account</h2><button class="btn light" type="button" onclick="closeForm()">×</button></div><div class="field"><label>USERNAME</label><input value="${esc(u.username)}" disabled></div><div class="field"><label>DISPLAY NAME</label><input id="eu_display" value="${esc(u.display_name)}"></div><div class="field"><label>ROLE</label><select id="eu_role"><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option><option value="owner" ${u.role==='owner'?'selected':''}>Owner</option></select></div><div class="field"><label>NEW PASSWORD (optional)</label><input id="eu_pass" type="password" minlength="10" placeholder="Leave blank to keep current password"></div><div class="field"><label>ACCOUNT STATUS</label><select id="eu_active"><option value="1" ${u.active?'selected':''}>Active</option><option value="0" ${!u.active?'selected':''}>Disabled</option></select></div><div class="actions" style="margin-top:16px"><button class="btn primary" type="button" onclick="saveUser(${u.id})">Save Account</button><button class="btn light" type="button" onclick="openUsers()">Cancel</button></div></div></div>`;
}

async function saveUser(id){try{await api('/api/admin/users/'+id,{method:'PUT',body:JSON.stringify({display_name:document.getElementById('eu_display').value.trim(),role:document.getElementById('eu_role').value,password:document.getElementById('eu_pass').value||undefined,active:document.getElementById('eu_active').value==='1'})});alert('Account updated.');openUsers()}catch(e){alert(e.message)}}

function exportJSON(){const blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='luxo-products-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function importJSON(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data))throw Error('JSON must contain a product array.');if(!confirm('Import '+data.length+' products? Existing products will not be deleted.'))return;for(const raw of data){const p={...raw};delete p.id;await api('/api/admin/products',{method:'POST',body:JSON.stringify(p)})}await load();alert('Import complete.')}catch(e){alert('Import failed: '+e.message)}document.getElementById('importFile').value=''}
async function load(){products=await api('/api/admin/products');renderStats();renderTable()}
async function logout(){try{await api('/api/admin/logout',{method:'POST'})}finally{login()}}
check();
</script>
</body>
</html>
